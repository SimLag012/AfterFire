# Dedicated clean installation; never aliases the legacy volumes.
name: afterfire-clean
services:
  db:
    restart: unless-stopped
    ports: !override []
  backend:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports: !override
      - "127.0.0.1:8000:8000"
    environment: &clean-environment
      DEMO_MODE: "false"
      AFTERFIRE_API_FIRST: "true"
      AFTERFIRE_EARTH_ENGINE_ENABLED: "true"
      AFTERFIRE_SATELLITE_PROVIDER: earth_engine
      AFTERFIRE_APPEEARS_SUBMISSION_ENABLED: "false"
      AFTERFIRE_FULL_HDF_AUTO_DOWNLOAD: "false"
      ALLOW_GLOBAL_DOWNLOADS: "false"
      AFTERFIRE_ANALYSIS_CACHE_MAX_GB: "2"
      AFTERFIRE_ANALYSIS_RESULTS_MAX_GB: "1"
  analysis-worker:
    restart: unless-stopped
    environment: *clean-environment
  frontend:
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:3000:3000"
volumes:
  pgdata:
    name: afterfire-clean-pgdata
  afterfire-cache:
    name: afterfire-clean-cache
