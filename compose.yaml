
services:
  db:
    image: postgis/postgis:15-3.3
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afterfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afterfire}
      POSTGRES_DB: ${POSTGRES_DB:-afterfire}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "8000:8000"
    environment: &backend-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://afterfire:afterfire@db:5432/afterfire}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      AFTERFIRE_API_FIRST: ${AFTERFIRE_API_FIRST:-true}
      AFTERFIRE_FULL_HDF_AUTO_DOWNLOAD: ${AFTERFIRE_FULL_HDF_AUTO_DOWNLOAD:-false}
      AFTERFIRE_SATELLITE_PROVIDER: ${AFTERFIRE_SATELLITE_PROVIDER:-auto}
      AFTERFIRE_EARTH_ENGINE_ENABLED: ${AFTERFIRE_EARTH_ENGINE_ENABLED:-false}
      AFTERFIRE_EE_BATCH_DATES: ${AFTERFIRE_EE_BATCH_DATES:-32}
      AFTERFIRE_EE_PROJECT_ID: ${AFTERFIRE_EE_PROJECT_ID:-}
      AFTERFIRE_API_MAX_REQUESTS: ${AFTERFIRE_API_MAX_REQUESTS:-1000}
      AFTERFIRE_API_MAX_RESPONSE_MB: ${AFTERFIRE_API_MAX_RESPONSE_MB:-16}
      AFTERFIRE_API_MAX_PIXELS: ${AFTERFIRE_API_MAX_PIXELS:-100000}
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      AFTERFIRE_CATALOG_CACHE_ENABLED: ${AFTERFIRE_CATALOG_CACHE_ENABLED:-true}
      AFTERFIRE_CATALOG_CACHE_TTL_HOURS: ${AFTERFIRE_CATALOG_CACHE_TTL_HOURS:-24}
      AFTERFIRE_PREFLIGHT_TTL_HOURS: ${AFTERFIRE_PREFLIGHT_TTL_HOURS:-6}
      AFTERFIRE_CACHE_AUTO_CLEANUP: ${AFTERFIRE_CACHE_AUTO_CLEANUP:-true}
      AFTERFIRE_CACHE_CLEANUP_THRESHOLD_PERCENT: ${AFTERFIRE_CACHE_CLEANUP_THRESHOLD_PERCENT:-85}
      AFTERFIRE_CACHE_TARGET_PERCENT: ${AFTERFIRE_CACHE_TARGET_PERCENT:-70}
      AFTERFIRE_RECOVERY_MAX_CELL_OBSERVATIONS: ${AFTERFIRE_RECOVERY_MAX_CELL_OBSERVATIONS:-2000000}
      AFTERFIRE_ADMIN_TOKEN: ${AFTERFIRE_ADMIN_TOKEN:-}
      AFTERFIRE_ANALYSIS_ON_DEMAND: ${AFTERFIRE_ANALYSIS_ON_DEMAND:-true}
      AFTERFIRE_ANALYSIS_WORKERS: ${AFTERFIRE_ANALYSIS_WORKERS:-1}
      AFTERFIRE_ANALYSIS_MAX_CONCURRENT_DOWNLOADS: ${AFTERFIRE_ANALYSIS_MAX_CONCURRENT_DOWNLOADS:-2}
      AFTERFIRE_ANALYSIS_PRE_EVENT_YEARS: ${AFTERFIRE_ANALYSIS_PRE_EVENT_YEARS:-3}
      AFTERFIRE_ANALYSIS_MAX_POST_EVENT_YEARS: ${AFTERFIRE_ANALYSIS_MAX_POST_EVENT_YEARS:-10}
      AFTERFIRE_ANALYSIS_CACHE_MAX_GB: ${AFTERFIRE_ANALYSIS_CACHE_MAX_GB:-10}
      AFTERFIRE_APPEEARS_SUBMISSION_ENABLED: ${AFTERFIRE_APPEEARS_SUBMISSION_ENABLED:-false}
      AFTERFIRE_ANALYSIS_HEARTBEAT_TIMEOUT_SECONDS: ${AFTERFIRE_ANALYSIS_HEARTBEAT_TIMEOUT_SECONDS:-60}
      AFTERFIRE_ANALYSIS_NO_PROGRESS_SECONDS: ${AFTERFIRE_ANALYSIS_NO_PROGRESS_SECONDS:-180}
      AFTERFIRE_ANALYSIS_OPERATION_TIMEOUT_SECONDS: ${AFTERFIRE_ANALYSIS_OPERATION_TIMEOUT_SECONDS:-600}
      AFTERFIRE_APPEEARS_ENABLED: ${AFTERFIRE_APPEEARS_ENABLED:-true}
      AFTERFIRE_APPEEARS_WAIT_SECONDS: ${AFTERFIRE_APPEEARS_WAIT_SECONDS:-1800}
      AFTERFIRE_ANALYSIS_TEMP_MAX_GB: ${AFTERFIRE_ANALYSIS_TEMP_MAX_GB:-1}
      AFTERFIRE_ANALYSIS_RESULTS_MAX_GB: ${AFTERFIRE_ANALYSIS_RESULTS_MAX_GB:-2}
      AFTERFIRE_ANALYSIS_MAX_BLOCK_GB: ${AFTERFIRE_ANALYSIS_MAX_BLOCK_GB:-1}
      AFTERFIRE_ANALYSIS_MAX_JOB_GB: ${AFTERFIRE_ANALYSIS_MAX_JOB_GB:-5}
      AFTERFIRE_ANALYSIS_MAX_GRANULES: ${AFTERFIRE_ANALYSIS_MAX_GRANULES:-400}
      AFTERFIRE_ANALYSIS_MAX_AREA_KM2: ${AFTERFIRE_ANALYSIS_MAX_AREA_KM2:-2500}
      AFTERFIRE_ANALYSIS_KEEP_SOURCE_GRANULES: ${AFTERFIRE_ANALYSIS_KEEP_SOURCE_GRANULES:-true}
      AFTERFIRE_ANALYSIS_CACHE_POLICY: ${AFTERFIRE_ANALYSIS_CACHE_POLICY:-retain}
      AFTERFIRE_ANALYSIS_MIN_FREE_GB: ${AFTERFIRE_ANALYSIS_MIN_FREE_GB:-1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANALYSIS_BBOX: ${ANALYSIS_BBOX:-}
      ANALYSIS_REGION_NAME: ${ANALYSIS_REGION_NAME:-}
      ANALYSIS_START_DATE: ${ANALYSIS_START_DATE:-2024-01-01}
      ANALYSIS_END_DATE: ${ANALYSIS_END_DATE:-}
      MAX_DOWNLOAD_DAYS_PER_REQUEST: ${MAX_DOWNLOAD_DAYS_PER_REQUEST:-5}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      MAX_DOWNLOAD_SIZE_MB: ${MAX_DOWNLOAD_SIZE_MB:-250}
      DATA_CACHE_ENABLED: ${DATA_CACHE_ENABLED:-true}
      ALLOW_GLOBAL_DOWNLOADS: ${ALLOW_GLOBAL_DOWNLOADS:-false}
    volumes:
      - afterfire-cache:/root/.cache/afterfire
    depends_on:
      db:
        condition: service_healthy

  analysis-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "-m", "app.jobs.analysis_worker"]
    environment: *backend-environment
    volumes:
      - afterfire-cache:/root/.cache/afterfire
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  afterfire-cache:
