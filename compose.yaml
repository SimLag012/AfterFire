version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afterfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afterfire}
      POSTGRES_DB: ${POSTGRES_DB:-afterfire}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterfire -d afterfire"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://afterfire:afterfire@db:5432/afterfire}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      EARTHDATA_USERNAME: ${EARTHDATA_USERNAME:-}
      EARTHDATA_PASSWORD: ${EARTHDATA_PASSWORD:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
